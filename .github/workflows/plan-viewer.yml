name: Plan Viewer

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "package*.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - "components.json"
      - ".github/workflows/plan-viewer.yml"
  workflow_dispatch:

jobs:
  compatibility:
    name: Plan compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: benjaminstelzer/scoville-suite
          # Published Plan helper and fixture contract, not application source.
          ref: 47cecddfe55aaf26d72ab44a66c5d6270abbd32e
          path: plan-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release gate
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compare Plan and Viewer progress
        run: >-
          python scripts/check_plan_compatibility.py
          --plan-root plan-contract/members/scoville-plan/scoville-plan
          --fixture-root plan-contract/members/scoville-plan/development/tests/fixtures/valid-profile

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            asset_id: linux-x64
            target_dir: src-tauri/target/release
          - name: Windows x64
            platform: windows-latest
            args: ""
            asset_id: windows-x64
            target_dir: src-tauri/target/release
          - name: macOS Apple Silicon
            platform: macos-15
            args: "--target aarch64-apple-darwin"
            asset_id: macos-arm64
            target_dir: src-tauri/target/aarch64-apple-darwin/release
          - name: macOS Intel
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            asset_id: macos-x64
            target_dir: src-tauri/target/x86_64-apple-darwin/release

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Read viewer version
        id: viewer
        shell: pwsh
        run: |
          $root = "."
          $package = Get-Content -Raw "$root/package.json" | ConvertFrom-Json
          $tauri = Get-Content -Raw "$root/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $cargo = [regex]::Match((Get-Content -Raw "$root/src-tauri/Cargo.toml"), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($package.version -ne $tauri.version -or $package.version -ne $cargo) {
            throw "Viewer versions differ: package=$($package.version), tauri=$($tauri.version), cargo=$cargo"
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$($package.version)`n")

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils

      - name: Install frontend dependencies
        working-directory: .
        run: npm ci

      - name: Check frontend
        working-directory: .
        run: npm run check

      - name: Test project reader
        working-directory: .
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: false

      - name: Stage Windows downloads
        if: matrix.asset_id == 'windows-x64'
        shell: pwsh
        run: |
          $version = '${{ steps.viewer.outputs.version }}'
          $source = "${{ matrix.target_dir }}"
          $target = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$source/scoville-plan-viewer.exe" "$target/scoville-plan-viewer-v$version-windows-x64.exe"
          Copy-Item (Get-ChildItem "$source/bundle/msi/*.msi" | Select-Object -First 1) "$target/scoville-plan-viewer-v$version-windows-x64.msi"
          Copy-Item (Get-ChildItem "$source/bundle/nsis/*-setup.exe" | Select-Object -First 1) "$target/scoville-plan-viewer-v$version-windows-x64-setup.exe"

      - name: Stage Linux downloads
        if: matrix.asset_id == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.viewer.outputs.version }}"
          source="${{ matrix.target_dir }}"
          target="${RUNNER_TEMP}/release-assets"
          mkdir -p "$target"
          install -m 755 "$source/scoville-plan-viewer" "$target/scoville-plan-viewer-v${version}-linux-x64"
          cp "$(find "$source/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)" "$target/scoville-plan-viewer-v${version}-linux-x64.AppImage"
          cp "$(find "$source/bundle/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)" "$target/scoville-plan-viewer-v${version}-linux-x64.deb"
          cp "$(find "$source/bundle/rpm" -maxdepth 1 -type f -name '*.rpm' -print -quit)" "$target/scoville-plan-viewer-v${version}-linux-x64.rpm"

      - name: Stage macOS downloads
        if: startsWith(matrix.asset_id, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.viewer.outputs.version }}"
          source="${{ matrix.target_dir }}"
          target="${RUNNER_TEMP}/release-assets"
          mkdir -p "$target"
          app="$(find "$source/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg="$(find "$source/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$target/scoville-plan-viewer-v${version}-${{ matrix.asset_id }}.app.zip"
          cp "$dmg" "$target/scoville-plan-viewer-v${version}-${{ matrix.asset_id }}.dmg"

      - name: Retain release downloads
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_id }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [build, compatibility]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksum manifest
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Retain checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-assets/SHA256SUMS.txt
          if-no-files-found: error
